# Nombre de la aplicacion
spring.application.name=biblioteca-digital

# Conexion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/biblioteca_digital
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Configuracion del servidor
server.port=8080

# Thymeleaf
spring.thymeleaf.cache=false

# Autenticación servicio-a-servicio (la clave privada permanece fuera del repositorio).
biblioteca.service-jwt.public-key-location=${BIBLIOTECA_SERVICE_JWT_PUBLIC_KEY_LOCATION:}
biblioteca.service-jwt.issuer=${BIBLIOTECA_SERVICE_JWT_ISSUER:prestamos-service}
biblioteca.service-jwt.audience=${BIBLIOTECA_SERVICE_JWT_AUDIENCE:biblioteca-digital}
