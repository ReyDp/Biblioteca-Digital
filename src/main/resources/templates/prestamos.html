<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mis préstamos | Biblioteca Digital</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
</head>
<body>
<div th:replace="~{fragments/navegacion :: principal}"></div>
<main class="login-container loans-page">
    <a class="back-link" th:href="@{/catalogo}">← Volver al catálogo</a>
    <section class="login-card loans-card">
        <p class="eyebrow">MI CUENTA</p>
        <h1>Mis préstamos</h1>
        <p class="subtitle">Consulta el estado y las fechas de tus libros.</p>

        <div class="empty-state" th:if="${#lists.isEmpty(prestamos)}">
            No tienes préstamos registrados todavía.
        </div>

        <div class="loan-list" th:unless="${#lists.isEmpty(prestamos)}">
            <article class="loan-item" th:each="prestamo : ${prestamos}">
                <!-- Cabecera: título, autor y estado -->
                <div class="loan-item-header">
                    <div class="loan-item-title">
                        <h2 th:text="${prestamo.libro.titulo}">Título del libro</h2>
                        <p class="loan-item-author" th:text="${prestamo.libro.autor}">Autor</p>
                    </div>
                    <span class="loan-status"
                          th:classappend="${prestamo.estado.name() == 'ACTIVO' ? 'loan-status--active' : 'loan-status--returned'}"
                          th:text="${prestamo.estado}">ACTIVO</span>
                </div>

                <!-- Fechas -->
                <div class="loan-item-dates">
                    <div class="loan-date-row">
                        <dt>Solicitado</dt>
                        <dd th:text="${prestamo.fechaPrestamo}"></dd>
                    </div>
                    <div class="loan-date-row">
                        <dt>Vencimiento</dt>
                        <dd th:text="${prestamo.fechaLimite}"></dd>
                    </div>
                    <div class="loan-date-row" th:if="${prestamo.estado.name() == 'DEVUELTO'}">
                        <dt>Devuelto</dt>
                        <dd th:text="${prestamo.fechaDevolucion}"></dd>
                    </div>
                </div>

                <!-- Multa -->
                <div class="loan-item-fine"
                     th:with="multaObj=${multaService.obtenerMultaPorPrestamoId(prestamo.id).orElse(null)}">
                    <!-- Préstamo activo: multa estimada -->
                    <div th:if="${prestamo.estado.name() == 'ACTIVO'}"
                         class="loan-fine-box"
                         th:with="estimada=${multaService.consultarMultaEstimada(prestamo)}">
                        <p class="loan-fine-label">Multa estimada</p>
                        <p class="loan-fine-amount" th:text="${#numbers.formatDecimal(estimada, 1, 2)}">$0.00</p>
                    </div>
                    <!-- Préstamo devuelto con multa -->
                    <div th:if="${prestamo.estado.name() == 'DEVUELTO' && multaObj != null}"
                         class="loan-fine-box"
                         th:classappend="${multaObj.estado.name() == 'PAGADA' ? 'loan-fine-box--paid' : (multaObj.estado.name() == 'PARCIAL' ? 'loan-fine-box--partial' : 'loan-fine-box--pending')}">
                        <p class="loan-fine-label">Multa</p>
                        <p class="loan-fine-amount" th:text="${#numbers.formatDecimal(multaObj.importeTotal, 1, 2)}">$0.00</p>
                        <span class="loan-fine-status"
                              th:text="${multaObj.estado}"
                              th:classappend="${multaObj.estado.name() == 'PAGADA' ? 'loan-fine-status--paid' : (multaObj.estado.name() == 'PARCIAL' ? 'loan-fine-status--partial' : 'loan-fine-status--pending')}">PENDIENTE</span>
                    </div>
                </div>

                <!-- Enlace a detalle -->
                <div class="loan-item-footer">
                    <a class="loan-detail-link" th:href="@{/prestamos/{id}(id=${prestamo.id})}">Ver detalle →</a>
                </div>
            </article>
        </div>
    </section>
</main>
</body>
</html>
