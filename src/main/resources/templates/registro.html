<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta | Biblioteca Digital</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
    <link rel="stylesheet" th:href="@{/css/navegacion.css}">
</head>
<body>
<div th:replace="~{fragments/navegacion :: principal}"></div>
<main class="login-container">
    <a class="back-link" th:href="@{/catalogo}">← Volver al catálogo</a>
    <section class="login-card">
        <div class="brand-mark">B</div>
        <p class="eyebrow">BIBLIOTECA DIGITAL</p>
        <h1>Crea tu cuenta</h1>
        <p class="subtitle">Regístrate como cliente para solicitar préstamos.</p>

        <form th:action="@{/registro}" th:object="${registro}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
            <div class="alert error" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p>
            </div>

            <label for="nombre">Nombre completo</label>
            <input id="nombre" th:field="*{nombre}" type="text" autocomplete="name" required>
            <small class="field-error" th:errors="*{nombre}"></small>

            <label for="correo">Correo electrónico</label>
            <input id="correo" th:field="*{correo}" type="email" autocomplete="email" required>
            <small class="field-error" th:errors="*{correo}"></small>

            <label for="documento">Documento</label>
            <input id="documento" th:field="*{documento}" type="text" required>
            <small class="field-error" th:errors="*{documento}"></small>

            <label for="telefono">Teléfono (opcional)</label>
            <input id="telefono" th:field="*{telefono}" type="tel" autocomplete="tel">
            <small class="field-error" th:errors="*{telefono}"></small>

            <label for="password">Contraseña</label>
            <input id="password" th:field="*{password}" type="password" autocomplete="new-password" required>
            <small class="field-error" th:errors="*{password}"></small>

            <label for="confirmacionPassword">Confirmar contraseña</label>
            <input id="confirmacionPassword" th:field="*{confirmacionPassword}" type="password" autocomplete="new-password" required>
            <small class="field-error" th:errors="*{confirmacionPassword}"></small>

            <button type="submit">Crear cuenta</button>
        </form>
        <p class="help-text">¿Ya tienes cuenta? <a th:href="@{/login}">Inicia sesión</a>.</p>
    </section>
</main>
</body>
</html>
